<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <img src="../../src/imgs/logo.png" alt="Imagem no canto superior esquerdo" class="image-top-left">
    <div class="admin-container">
        <a href="javascript:history.back()" class="btn-voltar">Voltar</a>
        <h1>Gerenciamento de Produtos</h1>
        <form id="form-produto" onsubmit="atualizarProduto(event)">
            <div class="form-group">
                <label for="nome-produto">Nome do Produto</label>
                <input type="text" id="nome-produto" name="nome-produto" required>
            </div>
            
            <div class="form-group">
                <label for="descricao-produto">Descrição</label>
                <textarea id="descricao-produto" name="descricao-produto"></textarea>
            </div>
            
            <div class="form-group">
                <label for="preco-produto">Preço</label>
                <input type="number" id="preco-produto" name="preco-produto" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="categoria-produto">Categoria</label>
                <select id="categoria-produto" name="categoria-produto" required>
                    <!-- Opções serão preenchidas via JavaScript -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="imagem-url">URL da Imagem</label>
                <input type="text" id="imagem-url" name="imagem-url">
            </div>
            
            <div class="form-actions">
                <button type="submit" id="btn-salvar" class="btn-prin">Salvar</button>
            </div>
        </form>
        <div class="modal-container">
            <button type="button" id="btn-abrir-modal" class="btn-prin">
                <i class="fas fa-tags"></i> Gerenciar Categorias
            </button>
    
            <div id="modal-categorias" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Gerenciar Categorias</h2>
                        <span class="close">&times;</span>
                    </div>
                    
                    <form id="form-categoria">
                        <div class="form-group">
                            <label for="nome-categoria">Nome da Categoria</label>
                            <input type="text" id="nome-categoria" name="nome-categoria" required>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn-prin">Cadastrar Categoria</button>
                        </div>
                    </form>
                    
                    <div id="lista-categorias" class="lista-categorias">
                        <!-- Categorias serão inseridas aqui via JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        <div id="produtos-cadastrados">
            <h2>Produtos Cadastrados</h2>
            <ul id="lista-produtos-cadastrados"></ul>
        </div>
    </div>

    <div id="notifications-container" class="notifications-container"></div>

    <script src="script/script.js" defer></script>
</body>
</html>

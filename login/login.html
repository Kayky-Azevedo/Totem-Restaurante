<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Cadastro</title>
</head>

<body>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>


    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="signupForm">
                <h1>Criar Conta</h1>
                <br>
                <input type="text" id="signupNome" placeholder="Nome" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupSenha" placeholder="Senha" required>
                <input type="text" id="signupTelefone" placeholder="Telefone" required>
                <button>Cadastre-se</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form id="loginForm">
                <h1>Login</h1>
                <br>
                <span>Insira seu email e senha para entrar</span>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginSenha" placeholder="Password" required>
                <a href="#" id="forgotPassword">Esqueceu a senha?</a>
                <button>Entrar</button>
            </form>
        </div>
        <div id="modalBackground" class="modal-background hidden"></div>
        <div id="resetPasswordModal" class="modal hidden">
            <form id="resetPasswordForm">
                <h2>Redefinir Senha</h2>
                <input type="email" id="email" placeholder="Digite seu email" required>
                <input type="password" id="newPassword" placeholder="Digite a nova senha" required>
                <button type="submit">Redefinir Senha</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Entre com seus dados pessoais</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá amigo</h1>
                    <p>Entre com seus dados pessoais</p>
                    <button class="hidden" id="register">Cadastre-se</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Cadastro</title>
</head>

<body>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <img src="../src/imgs/logo.png" alt="Imagem no canto superior esquerdo" class="image-top-left">
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="signupForm">
                <h1>Criar Conta</h1>
                <span>ou use seu email para cadastro</span>
                <input type="text" id="signupNome" placeholder="Nome" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="tel" id="signupTelefone" placeholder="Telefone" required>
                <div class="password-container">
                    <input type="password" id="signupSenha" placeholder="Senha" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form id="loginForm">
                <h1>Login</h1>
                <span>ou use seu email e senha</span>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <div class="password-container">
                    <input type="password" id="loginSenha" placeholder="Senha" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <a href="#" id="forgotPassword">Esqueceu sua senha?</a>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="modalBackground" class="modal-background hidden"></div>
        <div id="resetPasswordModal" class="modal">
            <h2>Redefinir Senha</h2>
            <form id="resetPasswordForm">
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Seu email" 
                    required
                >
                <div class="password-container">
                    <input type="password" id="newPassword" placeholder="Nova senha" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button type="submit">Redefinir Senha</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Entre com seus dados pessoais</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá amigo</h1>
                    <p>Entre com seus dados pessoais</p>
                    <button class="hidden" id="register">Cadastre-se</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script/script.js"></script>
</body>

</html>
